<script type="module">
import * as THREE from 'three';

 if(t==='molar'){for(const d of [-1,1]){const rm=new THREE.Mesh(rootGeo(2.1,.46,d),mD); rm.position.set(x+d*.42*Math.cos(.5),-1+.42,-d*.42*Math.sin(.5)); rm.rotation.y=.5; s.add(rm);}}}
